name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          # Ubuntu already has Android SDK pre-installed
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          ls /usr/local/lib/android/sdk/
          ls /usr/local/lib/android/sdk/platforms/
          ls /usr/local/lib/android/sdk/build-tools/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2

      - name: Prepare project structure
        run: |
          cp -r android/* .
          ls -la

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --max-workers=2

      - name: Show APK
        run: |
          find . -name "*.apk" -exec ls -la {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glass-swing-release
          path: app/build/outputs/apk/release/
          retention-days: 7
