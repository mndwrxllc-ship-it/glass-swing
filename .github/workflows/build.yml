name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: malinskiy/action-setup-android@v2025.08.26
        with:
          api-level: 34
          build-tools: "34.0.0"
          ndk: "26.1.10909125"
          ndk-agp-compat-check: false
          script: |
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Install Gradle wrapper
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.10.2

      - name: Prepare project structure
        run: |
          cp -r android/* .
          ls -la
          echo "---"
          ls -la app/

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --max-workers=2

      - name: Show APK
        run: |
          find . -name "*.apk" -exec ls -la {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glass-swing-release
          path: app/build/outputs/apk/release/
          retention-days: 7
