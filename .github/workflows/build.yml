name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: android-project

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: nttld/action-setup-android@v2
        with:
          api-level: 34
          ndk: 26.1.10909125
          ndk-agp-compat-check: false
          script: |
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Install Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.10.2

      - name: Prepare project structure
        run: |
          cp -r android-project/android/* android-project/
          cd android-project
          ls -la
          echo "---"
          ls -la app/

      - name: Build Release APK
        working-directory: android-project
        run: |
          gradle assembleRelease --no-daemon --max-workers=2

      - name: Show APK
        working-directory: android-project
        run: |
          find . -name "*.apk" -exec ls -la {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glass-swing-release
          path: android-project/app/build/outputs/apk/release/
          retention-days: 7
