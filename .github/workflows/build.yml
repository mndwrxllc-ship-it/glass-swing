name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          # Ubuntu already has Android SDK pre-installed
          export ANDROID_HOME=$ANDROID_HOME
          export ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # Install required components
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 || true
          echo "=== SDK contents ==="
          ls $ANDROID_HOME/platforms/
          ls $ANDROID_HOME/build-tools/

      - name: Install Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.10.2

      - name: Prepare project structure
        run: |
          cp -r android/* .
          ls -la

      - name: Build Release APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          gradle assembleRelease --no-daemon --max-workers=2

      - name: Show APK
        run: |
          find . -name "*.apk" -exec ls -la {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glass-swing-release
          path: app/build/outputs/apk/release/
          retention-days: 7
